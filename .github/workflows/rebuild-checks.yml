name: Rebuild checks
on:
  push:
    branches: [rebuild/english-guides-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HOWDOI_PUBLIC_RELEASE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair compatible dependencies on this owner-authorized feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/english-guides-preview' && github.repository == 'howdoi810-bot/howdoi-web'
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --json > npm-audit-before.json || true
          node -e 'const r=require("./npm-audit-before.json"); console.log("Before repair:", JSON.stringify(r.metadata?.vulnerabilities)); for (const [n,v] of Object.entries(r.vulnerabilities || {})) console.log(n, v.severity, JSON.stringify(v.via));'
          npm audit fix --package-lock-only --ignore-scripts || echo 'Some findings could not be repaired automatically; the final audit gate will check.'
          git diff --exit-code -- package.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'fix: lock compatible security updates for rebuild preview'
            git push origin HEAD:rebuild/english-guides-preview
          fi
          git rev-parse HEAD
      - name: Remove checkout credentials before installing dependencies
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - run: npm ci
      - name: Content and renderer tests
        run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Dependency audit - reject high and critical findings
        run: |
          if npm audit --audit-level=high --json > npm-audit-after.json; then
            audit_status=0
          else
            audit_status=$?
          fi
          node -e 'const r=require("./npm-audit-after.json"); if (!r.metadata?.vulnerabilities) throw new Error("Audit returned no usable report"); console.log("Final audit:", JSON.stringify(r.metadata.vulnerabilities)); for (const [n,v] of Object.entries(r.vulnerabilities || {})) console.log(n, v.severity, JSON.stringify(v.via));'
          exit "$audit_status"
      - name: Retain test report, audit evidence and review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-checks-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            npm-audit-before.json
            npm-audit-after.json
          retention-days: 7
          if-no-files-found: ignore
