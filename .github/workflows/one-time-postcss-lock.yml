name: One-time PostCSS lock repair
on:
  push:
    branches: [rebuild/english-guides-preview]
    paths:
      - .github/workflows/one-time-postcss-lock.yml
permissions:
  contents: read
jobs:
  lock:
    if: github.repository == 'howdoi810-bot/howdoi-web' && github.ref == 'refs/heads/rebuild/english-guides-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve only the reviewed manifest and remove this one-time workflow
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json
          npm audit --json > postcss-lock-audit.json || true
          node -e 'const r=require("./postcss-lock-audit.json"); if (!r.metadata?.vulnerabilities) throw new Error("Missing audit result"); console.log(JSON.stringify(r.metadata.vulnerabilities));'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git rm .github/workflows/one-time-postcss-lock.yml
          git commit -m 'fix: lock patched PostCSS and remove one-time repair workflow'
          git push origin HEAD:rebuild/english-guides-preview
      - name: Remove credentials
        if: always()
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postcss-lock-audit-${{ github.run_id }}
          path: postcss-lock-audit.json
          retention-days: 7
